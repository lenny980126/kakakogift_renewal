<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>카카오톡 선물하기 개선안 프로토타입</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap" rel="stylesheet" />
<style>
  :root {
    --ink: #191919;
    --muted: #8a8a8a;
    --sub: #777;
    --line: #eee;
    --soft: #f6f6f6;
    --yellow: #fee500;
    --red: #ff4646;
    --chat: #b2c7da;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: "Noto Sans KR", sans-serif;
    background: #ececef;
    color: var(--ink);
    letter-spacing: -0.2px;
  }
  button, input { font-family: inherit; }
  button { border: 0; background: none; padding: 0; cursor: pointer; color: inherit; }
  img { display: block; max-width: 100%; }
  .stage {
    min-height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 28px 16px 40px;
  }
  .intro { text-align: center; margin-bottom: 18px; }
  .intro h1 { margin: 0; font-size: 22px; font-weight: 700; }
  .intro p { margin: 6px 0 0; color: #666; font-size: 13px; }
  .modes { display: flex; gap: 8px; margin-top: 14px; justify-content: center; }
  .modes button { height: 36px; padding: 0 14px; border-radius: 18px; background: #fff; font-size: 13px; font-weight: 700; color: #666; }
  .modes button.on { background: #191919; color: #fff; }
  .phone {
    width: 390px;
    height: 844px;
    background: #fff;
    border-radius: 28px;
    overflow: hidden;
    box-shadow: 0 10px 30px rgba(0,0,0,.08);
    display: flex;
    flex-direction: column;
    position: relative;
  }
  .status {
    height: 46px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 6px 30px 0;
    flex: none;
    background: #fff;
  }
  .status b { font-size: 15px; }
  .status .sys { display: flex; gap: 6px; align-items: center; }
  .app { flex: 1; min-height: 0; display: flex; flex-direction: column; position: relative; }
  .scroll { flex: 1; overflow-x: hidden; overflow-y: auto; min-height: 0; min-width: 0; width: 100%; }
  #app.fwd { animation: inRight .34s cubic-bezier(.22,.7,.25,1); }
  #app.back { animation: inLeft .34s cubic-bezier(.22,.7,.25,1); }
  @keyframes inRight { from { opacity: 0; transform: translateX(28px); } to { opacity: 1; transform: none; } }
  @keyframes inLeft { from { opacity: 0; transform: translateX(-28px); } to { opacity: 1; transform: none; } }
  .fanfare { position: absolute; inset: 0; pointer-events: none; overflow: hidden; z-index: 30; }
  .fanfare i {
    position: absolute; top: 46%; left: var(--left);
    width: 9px; height: 14px; border-radius: 2px;
    animation: burst 1.15s ease-out forwards;
  }
  .fanfare b {
    position: absolute; top: 40%; left: 50%; font-size: 28px; font-weight: 400;
    animation: burst 1.15s ease-out forwards;
  }
  @keyframes burst {
    0% { transform: translate(-50%, 0) scale(.4) rotate(0deg); opacity: 1; }
    100% { transform: translate(calc(-50% + var(--x)), var(--y)) scale(1) rotate(var(--r)); opacity: 0; }
  }
  .scroll::-webkit-scrollbar { width: 0; }
  .header {
    height: 52px;
    display: flex;
    align-items: center;
    padding: 0 6px;
    flex: none;
    background: #fff;
  }
  .header h1 { margin: 0 0 0 2px; font-size: 17px; font-weight: 700; }
  .header .spacer { flex: 1; }
  .icon-btn { width: 40px; height: 40px; display: grid; place-items: center; }
  .gift-mark { width: 22px; height: 22px; margin-right: 2px; }
  .nav {
    height: 78px;
    border-top: 1px solid var(--line);
    display: flex;
    padding-top: 8px;
    background: #fff;
    flex: none;
    position: relative;
  }
  .nav button { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; color: #9a9a9a; font-size: 11px; }
  .nav button.on { color: var(--ink); font-weight: 700; }
  .nav .wish-slot { position: relative; flex: 1; }
  .nav-spacer { display: block; height: 40px; }
  .nav .wish-btn { position: absolute; left: 0; right: 0; top: -26px; display: flex; flex-direction: column; align-items: center; gap: 3px; color: #9a9a9a; font-size: 11px; }
  .nav .wish-btn.on { color: var(--ink); font-weight: 700; }
  .bubble {
    width: 60px; height: 60px; border-radius: 30px; background: #fff;
    border: 1px solid #e8e8e8; box-shadow: 0 6px 7px rgba(0,0,0,.12);
    display: grid; place-items: center;
  }
  .bubble img { width: 36px; height: 36px; object-fit: contain; }
  .card {
    margin: 2px 16px 0;
    border: 1px solid #ededed;
    border-radius: 20px;
    padding: 18px;
    box-shadow: 0 4px 7px rgba(0,0,0,.04);
    position: relative;
  }
  .who { display: flex; gap: 14px; align-items: center; }
  .plus {
    width: 72px; height: 72px; border-radius: 28px; border: 2px dashed #d3d3d3;
    background: #fafafa; color: #bdbdbd; font-size: 30px; font-weight: 300;
    display: grid; place-items: center; flex: none;
  }
  .who h2 { margin: 0; font-size: 20px; line-height: 27px; letter-spacing: -0.5px; }
  .who p { margin: 4px 0 0; color: var(--muted); font-size: 13px; }
  .friends {
    display: flex; gap: 10px; overflow-x: auto; padding: 14px 0 0; margin-top: 16px;
    border-top: 1px solid #f2f2f2;
  }
  .friends::-webkit-scrollbar { height: 0; }
  .friend { min-width: 54px; display: flex; flex-direction: column; align-items: center; gap: 6px; position: relative; font-size: 12px; }
  .avatar {
    width: 50px; height: 50px; border-radius: 19px; display: grid; place-items: center; font-size: 27px;
  }
  .friend.on .avatar { box-shadow: 0 0 0 2px var(--ink); }
  .cake { position: absolute; right: -2px; top: -6px; font-size: 15px; }
  .edit {
    position: absolute; right: 14px; top: 14px;
    border: 1px solid #ddd; border-radius: 999px; padding: 4px 10px;
    font-size: 12px; color: #555; background: #fff;
  }
  .edit.off { opacity: .35; }
  .cats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 18px 0; padding: 24px 10px 6px; }
  .cats button { display: flex; flex-direction: column; align-items: center; gap: 7px; font-size: 12px; color: #333; }
  .cats .ico { width: 54px; height: 54px; border-radius: 20px; background: var(--soft); display: grid; place-items: center; font-size: 26px; }
  .banner, .surprise {
    display: flex; align-items: center; width: calc(100% - 32px); margin: 18px 16px 0;
    height: 112px; border-radius: 18px; padding: 0 22px; text-align: left; box-sizing: border-box;
  }
  .banner { background: linear-gradient(142deg, #fff6b8 8%, #ffe77a 92%); }
  .surprise { margin-top: 10px; background: linear-gradient(135deg, #e7f3ff 0%, #d7e8fb 100%); }
  .banner small, .surprise small { display: block; font-size: 13px; font-weight: 700; }
  .banner small { color: #7a6500; }
  .surprise small { color: #3d5f86; }
  .banner strong, .surprise strong { display: block; margin-top: 4px; font-size: 20px; letter-spacing: -0.5px; line-height: 1.25; }
  .banner em, .surprise em { display: block; margin-top: 6px; font-style: normal; font-size: 13px; font-weight: 700; }
  .banner em { color: #5a4b00; }
  .surprise em { color: #3d5f86; }
  .banner .trophy, .surprise .trophy { margin-left: auto; font-size: 58px; line-height: 1; filter: drop-shadow(0 6px 6px rgba(0,0,0,.12)); }
  .section-title { padding: 24px 16px 14px; font-size: 18px; font-weight: 700; }
  .tabs { margin: 0 16px; background: var(--soft); border-radius: 12px; padding: 4px; display: flex; }
  .tabs button { flex: 1; height: 38px; border-radius: 9px; color: #888; font-size: 14px; font-weight: 600; }
  .tabs button.on { background: #fff; color: #111; box-shadow: 0 1px 2px rgba(0,0,0,.08); }
  .plist { padding: 6px 16px 10px; }
  .row { display: flex; gap: 12px; padding: 12px 0; width: 100%; text-align: left; align-items: flex-start; min-height: 108px; }
  .rank { width: 20px; padding-top: 2px; font-size: 17px; font-weight: 800; line-height: 20px; text-align: center; flex: none; }
  .thumb { width: 84px; height: 84px; border-radius: 12px; object-fit: cover; flex: none; background: #f3f3f3; }
  .meta { min-width: 0; flex: 1; }
  .meta .brand { display: block; font-size: 12px; line-height: 14px; color: #8a8a8a; font-weight: 400; }
  .meta .name {
    display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden;
    margin-top: 0; font-size: 14px; font-weight: 400;
    line-height: 19.6px; letter-spacing: -0.2px; color: #191919;
  }
  .meta .price { display: block; margin-top: 4px; font-size: 15px; font-weight: 700; line-height: 18px; }
  .price .off { color: var(--red); font-weight: 800; margin-right: 6px; }
  .meta .note { display: block; margin-top: 5px; color: var(--sub); font-size: 12px; line-height: 14px; font-weight: 400; }
  .row .thumb.ph { width: 84px; height: 84px; aspect-ratio: auto; }
  .row .thumb.ph .emo { font-size: 34px; }
  .more {
    margin: 4px 16px 0; height: 44px; width: calc(100% - 32px);
    border: 1px solid #e5e5e5; border-radius: 12px; color: #555; font-size: 14px;
  }
  .pad { height: 24px; }
  .chips { display: flex; gap: 6px; overflow-x: auto; padding: 4px 16px 12px; }
  .chips::-webkit-scrollbar { height: 0; }
  .chips button { height: 35px; padding: 0 13px; border-radius: 999px; background: var(--soft); font-size: 13px; white-space: nowrap; }
  .chips button.on { background: var(--ink); color: #fff; font-weight: 700; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px 12px; padding: 8px 16px 24px; }
  .grid button { text-align: left; position: relative; }
  .lock { position: absolute; left: 8px; top: 8px; background: rgba(25,25,25,.78); color: #fff; border-radius: 999px; padding: 3px 7px; font-size: 11px; font-weight: 700; }
  .grid img, .grid .ph { width: 100%; aspect-ratio: 1; border-radius: 12px; object-fit: cover; background: #f6efe6; }
  .ph { display: flex; align-items: center; justify-content: center; overflow: hidden; min-width: 0; max-width: 100%; }
  .ph .emo { font-size: 42px; line-height: 1; }
  .grid .brand { margin-top: 8px; color: var(--muted); font-size: 12px; }
  .grid .name { margin-top: 2px; font-size: 14px; line-height: 1.4; min-height: 39px; }
  .grid .price { margin-top: 4px; font-weight: 700; font-size: 15px; }
  .profile { display: flex; gap: 14px; align-items: center; padding: 12px 18px 20px; }
  .profile .avatar { width: 64px; height: 64px; border-radius: 24px; font-size: 34px; }
  .profile h2 { margin: 0; font-size: 19px; }
  .profile p { margin: 4px 0 0; color: var(--muted); font-size: 13px; }
  .point {
    margin: 0 16px; border-radius: 16px; padding: 16px 18px;
    background: linear-gradient(149deg, #fff6b8 8%, #ffe77a 92%);
    display: flex; align-items: center;
  }
  .point small { color: #6b5a00; font-size: 12.5px; }
  .point strong { display: block; margin-top: 2px; font-size: 22px; font-weight: 800; }
  .point img { width: 58px; height: 47px; object-fit: contain; margin-left: auto; }
  .menu { margin-top: 12px; }
  .menu button { width: 100%; display: flex; align-items: center; padding: 16px 18px; border-bottom: 1px solid #f5f5f5; font-size: 15px; }
  .menu button span { margin-left: auto; color: #bbb; }
  .hero-card {
    margin: 4px 16px 0; border-radius: 24px; padding: 26px 20px 22px; text-align: center; overflow: hidden;
    background: radial-gradient(circle at 50% 28%, #fff7c2 0%, #ffee61 35%, #fee229 62%, #fee500 100%);
  }
  .pill { display: inline-block; background: rgba(0,0,0,.85); color: #fff; border-radius: 999px; padding: 5px 12px; font-size: 12px; font-weight: 700; }
  .hero-card h2 { margin: 12px 0 0; font-size: 30px; font-weight: 900; letter-spacing: -1.2px; }
  .hero-card p { margin: 6px auto 0; max-width: 260px; color: #5c4e00; font-size: 13.5px; line-height: 20.25px; font-weight: 400; }
  .trophy-wrap { width: 170px; height: 150px; margin: 2px auto 0; position: relative; display: grid; place-items: center; font-size: 104px; line-height: 1; filter: drop-shadow(0 14px 10px rgba(150,100,0,.35)); }
  .trophy-wrap .sp { position: absolute; font-size: 22px; }
  .trophy-wrap .sp.a { left: 10px; top: 16px; }
  .trophy-wrap .sp.b { right: 8px; top: 42px; }
  .start {
    width: 220px; height: 58px; border-radius: 999px; background: #191919; color: #fff;
    font-size: 20px; font-weight: 900; letter-spacing: 0.5px;
    box-shadow: 0 8px 0 #000, 0 14px 10px rgba(0,0,0,.2);
  }
  .filters { display: flex; gap: 6px; padding: 0 16px 2px; }
  .filters button { height: 35px; padding: 0 13px; border-radius: 999px; background: #fff; border: 1px solid #e3e3e3; color: #555; font-size: 13px; font-weight: 400; }
  .filters button.on { background: #191919; color: #fff; border-color: #191919; font-weight: 400; }
  .match-head { text-align: center; padding: 6px 16px 0; }
  .match-head h2 { margin: 0; font-size: 24px; font-weight: 900; letter-spacing: -0.8px; }
  .badge { display: inline-block; margin-top: 10px; background: var(--yellow); border-radius: 999px; padding: 5px 12px; font-size: 13px; font-weight: 700; }
  .bar { height: 6px; background: #f1f1f1; border-radius: 999px; margin: 14px 36px 0; overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--ink); }
  .vs { display: flex; gap: 12px; padding: 26px 16px 0; position: relative; min-width: 0; }
  .vs button { flex: 1; min-width: 0; overflow: hidden; border: 2px solid #eee; border-radius: 20px; padding: 10px 10px 14px; text-align: left; background: #fff; }
  .vs button:active { border-color: var(--ink); }
  .vs img, .vs .ph { width: 100%; height: 168px; object-fit: cover; border-radius: 12px; background: #eee; aspect-ratio: auto; }
  .vs .ph { object-fit: contain; }
  .vs .ph .emo { font-size: 52px; }
  .vs .brand { margin-top: 10px; color: var(--muted); font-size: 12px; }
  .vs .name { margin-top: 2px; font-size: 13.5px; line-height: 1.4; min-height: 38px; }
  .vs .price { margin-top: 4px; font-weight: 700; }
  .vs-mark {
    position: absolute; left: 50%; top: 118px; transform: translateX(-50%);
    width: 50px; height: 50px; border-radius: 25px; background: var(--ink); color: var(--yellow);
    border: 4px solid #fff; display: grid; place-items: center; font-weight: 900; font-size: 18px;
  }
  .hint { text-align: center; color: #999; font-size: 13px; padding: 22px 16px; }
  .picked { margin: 16px; border-radius: 18px; overflow: hidden; border: 1px solid #eee; position: relative; }
  .picked img, .picked .ph { width: 100%; height: 220px; object-fit: cover; aspect-ratio: auto; }
  .picked .ph { object-fit: contain; }
  .picked .ph .emo { font-size: 72px; }
  .crown { position: absolute; left: 50%; top: 12px; transform: translateX(-50%); background: var(--ink); color: var(--yellow); border-radius: 999px; padding: 5px 12px; font-size: 13px; font-weight: 700; }
  .picked .body { padding: 14px 16px 16px; }
  .result-note { text-align: center; padding: 16px 16px 0; }
  .result-note h2 { margin: 8px 0 0; font-size: 20px; }
  .result-note p { margin: 6px 0 0; color: #777; font-size: 13px; }
  .split { display: flex; gap: 8px; padding: 0 16px; }
  .split button { flex: 1; height: 50px; border-radius: 12px; font-size: 15px; }
  .split .ghost { border: 1px solid #e5e5e5; }
  .split .solid { background: var(--ink); color: #fff; font-weight: 700; }
  .pct { margin-left: auto; font-weight: 700; font-size: 14px; align-self: center; }
  .track { height: 6px; background: #f1f1f1; border-radius: 999px; margin-top: 8px; }
  .track i { display: block; height: 100%; background: var(--yellow); border-radius: 999px; }
  .hero-img { width: 100%; max-width: 100%; height: 280px; object-fit: cover; background: #f6efe6; }
  .hero-img.ph { aspect-ratio: auto; }
  .hero-img.ph .emo { font-size: 92px; }
  .detail { padding: 20px 18px 8px; }
  .detail .brand { color: var(--muted); font-size: 13px; }
  .detail h2 { margin: 6px 0 0; font-size: 20px; line-height: 1.35; }
  .detail .price { margin-top: 10px; font-size: 24px; font-weight: 800; }
  .wish-banner {
    margin-top: 18px; background: #fff1e8; border-radius: 18px; padding: 16px 16px 16px 10px;
    display: flex; gap: 8px; align-items: center;
  }
  .wish-banner img { flex: none; width: 72px; height: 72px; object-fit: contain; }
  .wish-banner p { flex: 1; min-width: 0; margin: 0; font-size: 14px; line-height: 1.45; font-weight: 500; text-align: left; }
  .wish-banner b { display: block; font-weight: 800; margin-bottom: 2px; }
  .wish-banner em { font-style: normal; color: #ff4b4b; font-weight: 800; }
  .specs { margin-top: 20px; border-top: 1px solid #f3f3f3; }
  .specs div { display: flex; padding: 13px 0; border-bottom: 1px solid #f6f6f6; font-size: 14px; }
  .specs b { width: 90px; font-weight: 500; color: #555; }
  .disclaimer { color: #999; font-size: 12px; line-height: 1.45; padding: 16px; }
  .bottom-bar {
    display: flex; gap: 10px; padding: 11px 16px 18px; background: #fff; border-top: 1px solid #f3f3f3; flex: none;
  }
  .bottom-bar .icon-sq { width: 54px; height: 54px; border-radius: 14px; background: var(--soft); font-size: 22px; }
  .cta { flex: 1; height: 54px; border-radius: 12px; background: var(--yellow); font-size: 16px; font-weight: 700; }
  .cta.dark { background: var(--ink); color: #fff; }
  .block { padding: 20px 16px 8px; }
  .block h3 { margin: 0 0 8px; font-size: 16px; }
  .person { display: flex; align-items: center; gap: 12px; padding: 8px 0 12px; }
  .person .avatar { width: 48px; height: 48px; border-radius: 16px; font-size: 26px; }
  .person b { font-size: 16px; }
  .person small { display: block; color: var(--muted); margin-top: 2px; }
  .change { margin-left: auto; border: 1px solid #e5e5e5; border-radius: 8px; padding: 6px 12px; font-size: 13px; }
  .msg-chips { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 8px; }
  .msg-chips button { height: 35px; padding: 0 13px; border-radius: 999px; background: var(--soft); white-space: nowrap; font-size: 13px; }
  .msg-chips button.on { background: var(--ink); color: #fff; }
  .letter { margin-top: 8px; background: #fffaf0; border-radius: 16px; padding: 18px; min-height: 140px; position: relative; }
  .letter .emo { font-size: 36px; }
  .letter p { margin: 8px 0 0; font-size: 15px; }
  .letter small { position: absolute; right: 14px; bottom: 10px; color: #aaa; }
  .pay-row { display: flex; align-items: center; gap: 12px; padding: 8px 0; }
  .qty { margin-left: auto; display: flex; border: 1px solid #eee; border-radius: 8px; overflow: hidden; }
  .qty button, .qty span { width: 32px; height: 30px; display: grid; place-items: center; }
  .pay-opt { width: 100%; display: flex; align-items: center; gap: 10px; height: 44px; font-size: 15px; }
  .radio { width: 18px; height: 18px; border-radius: 50%; border: 2px solid #ccc; }
  .pay-opt.on .radio { border-color: var(--ink); box-shadow: inset 0 0 0 4px var(--ink); }
  .sum { display: flex; justify-content: space-between; padding: 8px 0; font-size: 14px; }
  .sum.total { border-top: 1px solid #f0f0f0; margin-top: 6px; padding-top: 14px; font-weight: 800; font-size: 18px; }
  .sum .minus { color: var(--red); }
  .note-box { background: #fff8dc; border-radius: 12px; padding: 12px 14px; font-size: 13px; line-height: 1.45; margin-top: 8px; }
  .done { text-align: center; padding: 40px 24px 10px; }
  .done-actions { padding: 8px 24px 28px; display: flex; flex-direction: column; gap: 8px; }
  .done-actions button { width: 100%; margin: 0; height: 54px; border-radius: 12px; font-size: 16px; font-weight: 700; }
  .done-actions .line, .done-dock .line { border: 1px solid #e5e5e5; background: #fff; color: #191919; }
  .done-dock { flex: none; display: flex; flex-direction: column; gap: 8px; padding: 12px 24px 18px; background: #fff; }
  .done-dock button { width: 100%; height: 54px; border-radius: 14px; font-size: 16px; font-weight: 700; flex: none; }
  .done-dock .line { height: 50px; }
  .scroll.done-page .disclaimer { padding: 16px 24px; }
  .scroll.done-page .receipt { margin-left: 24px; margin-right: 24px; }
  .done .big { font-size: 72px; line-height: 0; }
  .done .gift-art { width: 110px; height: 110px; display: block; margin: 0 auto; }
  .done h2 { margin: 8px 0 0; font-size: 24px; line-height: 1.35; }
  .done p { color: #666; }
  .receipt { margin: 18px 24px; background: #fafafa; border-radius: 16px; padding: 16px; display: flex; gap: 12px; text-align: left; align-items: center; }
  .receipt img, .receipt .ph { width: 60px; height: 60px; border-radius: 12px; object-fit: cover; aspect-ratio: auto; flex: none; }

function fanfare() {

  const layer = document.createElement("div");
  layer.className = "fanfare";
  const colors = ["#fee500", "#ff5b7a", "#5ec8ff", "#c084fc", "#fff", "#ff9f43"];
  for (let i = 0; i < 42; i++) {
    const bit = document.createElement("i");
    bit.style.background = colors[i % colors.length];
    bit.style.setProperty("--left", (18 + Math.random() * 64) + "%");
    bit.style.setProperty("--x", (Math.random() * 220 - 110) + "px");
    bit.style.setProperty("--y", (-120 - Math.random() * 280) + "px");
    bit.style.setProperty("--r", (Math.random() * 520 - 260) + "deg");
    bit.style.animationDelay = (Math.random() * 0.12) + "s";
    layer.appendChild(bit);
  }
  ["🎉", "✨", "🎊"].forEach((mark, i) => {
    const bit = document.createElement("b");
    bit.textContent = mark;
    bit.style.setProperty("--left", (30 + i * 18) + "%");
    bit.style.setProperty("--x", (i - 1) * 70 + "px");
    bit.style.setProperty("--y", "-210px");
    bit.style.setProperty("--r", "20deg");
    layer.appendChild(bit);
  });

  setTimeout(() => layer.remove(), 1200);
}

          <div><b>${f.name}</b><small>${chat ? "카카오톡 친구" : "카카오톡 친구 · 핑퐁 위시 상품 선물"}</small></div>
          <button class="change" data-go="home">변경</button>
        </div>
      </section>
      <section class="block"><h3>메시지 카드</h3>
        <div class="msg-chips">
          <button class="${state.card === "cheer" ? "on" : ""}" data-card="cheer">💪 응원해</button>
          <button class="${state.card === "thanks" ? "on" : ""}" data-card="thanks">💛 고마워</button>
          <button class="${state.card === "birth" ? "on" : ""}" data-card="birth">🎂 생일 축하해</button>
          <button class="${state.card === "plain" ? "on" : ""}" data-card="plain">🎁 그냥</button>
        </div>
        <div class="letter"><div class="emo">${card.emoji}</div><p>${card.text}</p><small>${card.text.length}/100</small></div>
      </section>
      <section class="block"><h3>선물 상품</h3>
        <div class="pay-row">${thumb(p)}<div class="meta"><div class="brand">${p.brand}</div><div class="name">${p.name}</div><div class="price">${won(unit)}</div></div>
          <div class="qty"><button data-qty="-1">−</button><span>${state.qty}</span><button data-qty="1">+</button></div>
        </div>
      </section>
      <section class="block"><h3>결제 수단</h3>
        ${methods.map(([id, label]) => `<button class="pay-opt ${state.payMethod === id ? "on" : ""}" data-pay="${id}"><span class="radio"></span>${id === "kakao" ? `<b style="background:#fee500;border-radius:4px;padding:2px 6px;font-size:12px">pay</b>` : ""}${label}</button>`).join("")}
      </section>
      <section class="block"><h3>결제 금액</h3>
        <div class="sum"><span>상품 금액</span><span>${won(unit * state.qty)}</span></div>
        ${disc ? `<div class="sum"><span>핑퐁 위시 즉시 할인 (5%)</span><span class="minus">−${won(disc)}</span></div>` : ""}
        <div class="sum total"><span>총 결제 금액</span><span>${won(total)}</span></div>
        ${disc ? `<div class="note-box">🎁 ${f.name}님 위시 상품이라 ${won(disc)} 할인됐어요. ${f.name}님에게도 ${Math.round(total * 0.01).toLocaleString("ko-KR")}P 핑퐁 포인트가 쌓여요.</div>` : ""}
      </section>
      <p class="disclaimer">본 페이지는 프로젝트의 일환으로 제작되었으며, 실제 결제가 이루어지지 않습니다.</p>
    </div>
    <div class="bottom-bar"><button class="cta dark" data-act="${chat ? "chatpay" : "pay"}">${won(buttonPrice)} 결제하기</button></div>`;
}
function renderDone(mode) {
  const chat = mode === "chat";
  const p = P(chat ? state.chatGift : state.product);
  const f = chat ? friendBy("ryeon") : (friendBy(state.friend) || friendBy("hong"));
  const shown = chat ? p.price : (priceOf(p) * state.qty - wishDiscount(p));
  const gift = `<svg class="gift-art" viewBox="0 0 110 110" aria-hidden="true">
      <ellipse cx="55" cy="102" rx="26" ry="4" fill="#000" opacity=".08"/>
      <path d="M28 50h54l8-8v44l-8 8H28V50z" fill="#E8B02E"/>
      <path d="M82 42h8v44l-8 8V50z" fill="#C98A12"/>
      <rect x="24" y="48" width="62" height="48" rx="3" fill="#F5C518"/>
      <rect x="20" y="42" width="70" height="14" rx="3" fill="#FFD84A"/>
      <rect x="48" y="42" width="14" height="54" fill="#F04438"/>
      <rect x="20" y="62" width="70" height="13" fill="#E53935"/>
      <path d="M55 40c-8-14-26-12-24 0 8 2 16 2 24 0z" fill="#FF5A4F"/>
      <path d="M55 40c8-14 26-12 24 0-8 2-16 2-24 0z" fill="#E23B32"/>
      <ellipse cx="40" cy="34" rx="7" ry="4" fill="#FF8A80" opacity=".55"/>
      <circle cx="55" cy="40" r="6" fill="#C62828"/>
      <circle cx="55" cy="39" r="2.2" fill="#FF8A80"/>
    </svg>`;
  const body = `<div class="done"><div class="big">${gift}</div><h2>${f.name}님에게<br>선물을 보냈어요!</h2><p>카카오톡 채팅방으로 선물 메시지가 전달됐어요.</p></div>
    <div class="receipt">${thumb(p)}<div><div class="brand" style="color:#8a8a8a;font-size:12px">${p.brand}</div><div>${p.name}</div><b>${won(shown)}</b></div></div>`;
  if (!chat) {
    return `<div class="scroll done-page" style="background:#fff">
      ${body}
      <div class="done-note">
        <div class="rally-line"><img src="${logo}" alt="" />핑퐁 랠리 성공! 나의 카카오 포인트 +4점</div>
        <p>본 페이지는 프로젝트의 일환으로 제작되었으며, 실제 결제가 이루어지지 않습니다.</p>
      </div>
    </div>
    <div class="bottom-bar"><button class="cta" data-act="reset-home">선물하기 홈으로</button></div>`;
  }
  return `<div class="scroll done-page" style="background:#fff">
    ${body}
    <div class="done-note center"><p>본 페이지는 프로젝트의 일환으로 제작되었으며, 실제 결제가 이루어지지 않습니다.</p></div>
  </div>
  <div class="done-dock">
    <button class="cta" data-go="chat">채팅방으로 돌아가기</button>
    <button class="line" data-go="home">선물하기 홈으로</button>
  </div>`;
}
function chatThread() {
  return `<div class="date"><span>2026년 10월 1일 목요일</span></div>
    <div class="msg"><div class="avatar" style="background:#ffd9e4">👧🏻</div><div><span class="who">홍련</span><div style="display:flex;gap:6px;align-items:flex-end"><div class="bubble-txt">헐 웬 커피야 ㅋㅋㅋ 잘 마실게!!</div><span class="time">오후 6:20</span></div></div></div>
    <div class="date"><span>2026년 10월 2일 금요일</span></div>
    <div class="msg"><div class="avatar" style="background:#ffd9e4">👧🏻</div><div><span class="who">홍련</span><div style="display:flex;gap:6px;align-items:flex-end"><div class="bubble-txt">나 오늘 발표 드디어 끝났어</div><span class="time">오후 8:31</span></div></div></div>
    <div class="msg"><div class="avatar" style="background:#ffd9e4">👧🏻</div><div><span class="who">홍련</span><div style="display:flex;gap:6px;align-items:flex-end"><div class="bubble-txt">어제 밤새서 준비했더니 진짜 <b>힘들다</b> ㅠㅠ</div><span class="time">오후 8:31</span></div></div></div>
    <div class="msg me"><span class="time">오후 8:32</span><div class="bubble-txt">헐 진짜 <b>수고했어</b>!!</div></div>`;
}
function chatChrome(body, sheet) {
  return `<div class="chat">
    <div class="chat-head"><button class="back-count" data-go="mypage">${icon("back")} 14</button><h1>홍련</h1><div class="spacer"><button class="icon-btn">${icon("search")}</button><button class="icon-btn">${icon("menu")}</button></div></div>
    <div class="thread">${body}</div>
    <div class="composer-wrap">
      <button class="heart-cta" data-act="cheer">🎁 마음을 전하세요 ♡</button>
      <div class="composer"><button class="plus">+</button><div class="field">메시지 입력</div><button style="width:34px;font-size:20px">☺</button><button class="hash">#</button></div>
    </div>
    ${sheet || ""}
  </div>`;
}
function renderCheer() {
  const item = (id) => {
    const p = P(id);
    return `<button data-chatgift="${id}">${p.img ? `<img class="round-img" src="${p.img}" alt="" style="background:${p.bg}" />` : `<div class="round-img ph" style="background:${p.bg}"><span class="emo">${p.emoji}</span></div>`}<span>${p.name.split(" ")[0]}</span><small>${won(p.price)}</small></button>`;
  };
  const sheet = `<div class="sheet-mask"><div class="sheet"><div class="grab"></div>
    <h3><span class="avatar" style="background:#ffd9e4;width:28px;height:28px;border-radius:10px;display:inline-grid;place-items:center;font-size:16px;margin-right:6px">👧🏻</span>홍련님에게 <span class="mark">응원의 선물</span> 🎉</h3>
    <p class="sub">"힘들다"는 홍련님에게 작은 마음을 전해보세요</p>
    <div class="cheer-row">${item("bacchus")}${item("choco")}<button data-act="more"><div class="dash">+</div><span>더보기</span></button></div>
  </div></div>`;
  return chatChrome(chatThread(), sheet);
}
function renderMore() {
  const ids = ["vita","hotsix","mega1","jung","single","cake"];
  const sheet = `<div class="sheet-mask"><div class="sheet" style="height:72%">
    <div class="sheet-head"><div><h3 style="margin:0">더 많은 응원 선물</h3><p class="sub">부담 없이 마음을 전하기 좋은 선물</p></div><button data-act="cheer">×</button></div>
    <div class="more-grid">${ids.map((id) => gridCard(id).replace("data-product", "data-chatgift")).join("")}</div>
  </div></div>`;
  return chatChrome(chatThread(), sheet);
}

function render() {
  const chatBg = ["chat","cheer","more"].includes(state.screen);
  status(chatBg ? "#b2c7da" : "#fff");
  const app = $("#app");
  const map = {
    home: renderHome,
    category: renderCategory,
    mypage: renderMypage,
    wish: renderWish,
    rank: renderRank,
    match: renderMatch,
    result: renderResult,
    product: renderProduct,
    pay: () => renderPay("gift"),
    done: () => renderDone("gift"),
    chat: () => chatChrome(chatThread()),
    cheer: renderCheer,
    more: renderMore,
    chatpay: () => renderPay("chat"),
    chatdone: () => renderDone("chat")
  };
  const changed = state.shown !== state.screen;
  app.innerHTML = (map[state.screen] || renderHome)();
  const sc = app.querySelector(".scroll, .thread");
  if (sc) sc.scrollTop = 0;
  if (changed) {
    app.classList.remove("fwd", "back");
    void app.offsetWidth;
    app.classList.add(state.dir < 0 ? "back" : "fwd");
    state.shown = state.screen;
  }
  const chatMode = ["chat","cheer","more","chatpay","chatdone"].includes(state.screen);
  document.getElementById("open-gift").classList.toggle("on", !chatMode);
  document.getElementById("open-chat").classList.toggle("on", chatMode);
}

document.getElementById("app").addEventListener("click", (e) => {
  const t = e.target.closest("[data-go],[data-act],[data-friend],[data-product],[data-tab],[data-cat],[data-filter],[data-wishtab],[data-pick],[data-card],[data-pay],[data-qty],[data-chatgift]");
  if (!t) return;
  if (t.dataset.go) {
    if (t.dataset.go === "home") { state.dir = -1; state.history = []; state.screen = "home"; render(); return; }
    if (t.dataset.go === "chat") { state.card = "cheer"; state.qty = 1; }
    go(t.dataset.go);
    return;
  }
  if (t.dataset.friend) { state.friend = t.dataset.friend; render(); return; }
  if (t.dataset.tab) { state.tab = t.dataset.tab; render(); return; }
  if (t.dataset.cat) { state.cat = t.dataset.cat; if (state.screen !== "category") go("category"); else render(); return; }
  if (t.dataset.filter) { state.rankFilter = t.dataset.filter; render(); return; }
  if (t.dataset.wishtab) { state.wishTab = t.dataset.wishtab; render(); return; }
  if (t.dataset.product) { openProduct(t.dataset.product); return; }
  if (t.dataset.pick) {
    state.pick = t.dataset.pick;
    state.winners.push(t.dataset.pick);
    state.match += 1;
    if (state.match >= state.pool.length / 2) {
      if (state.winners.length === 1) { go("result"); fanfare(); }
      else {
        state.pool = state.winners.slice();
        state.winners = [];
        state.match = 0;
        render();
      }
    } else render();
    return;
  }
  if (t.dataset.card) { state.card = t.dataset.card; render(); return; }
  if (t.dataset.pay) { state.payMethod = t.dataset.pay; render(); return; }
  if (t.dataset.qty) { state.qty = Math.max(1, state.qty + Number(t.dataset.qty)); render(); return; }
  if (t.dataset.chatgift) { state.chatGift = t.dataset.chatgift; state.card = "cheer"; state.qty = 1; go("chatpay"); return; }
  const act = t.dataset.act;
  if (act === "back") back();
  if (act === "home" || act === "reset-home") { state.dir = -1; state.friend = null; state.history = []; state.screen = "home"; render(); }
  if (act === "clear") { state.friend = null; render(); }
  if (act === "start" || act === "replay") {
    state.pool = field.slice();
    state.winners = [];
    state.match = 0;
    state.pick = null;
    go("match");
  }
  if (act === "others") { const el = document.getElementById("others"); if (el) el.scrollIntoView({ behavior: "smooth" }); }
  if (act === "share") alert("공유 링크를 복사했어요. (프로토타입)");
  if (act === "pay") go("done");
  if (act === "chatpay") go("chatdone");
  if (act === "cheer") {
    const fromChat = state.screen === "chat";
    state.dir = 1;
    state.screen = "cheer";
    render();
    if (fromChat) fanfare();
  }
  if (act === "more") { state.screen = "more"; render(); }
});

document.getElementById("open-gift").addEventListener("click", () => {
  state.dir = -1;
  state.history = [];
  state.screen = "home";
  render();
});
document.getElementById("open-chat").addEventListener("click", () => {
  state.dir = 1;
  state.history = [];
  state.screen = "chat";
  render();
});

render();
</script>
</body>
</html>
